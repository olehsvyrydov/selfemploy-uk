# Nightly E2E Suite
#
# The e2e-tagged tests need a JavaFX toolkit, so PR CI excludes them — and they rot unseen as a
# result. Two test classes had been failing since January before anyone looked.
#
# This runs them nightly and never blocks a PR. It does not simply report red forever, which teaches
# people to ignore it: it fails only when the number of broken tests goes UP, so the suite cannot rot
# further while the backlog is repaired. See scripts/e2e-baseline.txt.

name: Nightly E2E

on:
  schedule:
    # 03:00 UTC, after the day's merges have landed
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E suite (JavaFX)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # openbox because Xvfb alone has no window manager: without one a stage never takes focus, so
      # TestFX's key and click events go nowhere and its lookups find no nodes. x11-utils supplies
      # xdpyinfo, which is how the next step knows the display is actually up.
      - name: Install Xvfb and a window manager
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox x11-utils

      # Brings the display up and refuses to run without it. A background process cannot fail this
      # step on its own - `bash -e` never sees its exit status - so both are started and then proved
      # alive. Otherwise an X server that died or was slow to bind would make every JavaFX test
      # error at once, and the ratchet would report an infrastructure fault as a mass regression.
      - name: Start the display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          xvfb_pid=$!
          for _ in $(seq 30); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          if ! xdpyinfo -display :99 >/dev/null 2>&1; then
            echo "::error::Xvfb never came up on :99; not running the suite against no display."
            exit 1
          fi

          DISPLAY=:99 openbox &
          openbox_pid=$!
          sleep 2
          if ! kill -0 "$xvfb_pid" 2>/dev/null || ! kill -0 "$openbox_pid" 2>/dev/null; then
            echo "::error::The display or its window manager died on startup; TestFX would find no nodes."
            exit 1
          fi
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Do NOT add -Dtestfx.headless=true here: it requires Monocle, which is not a dependency, and
      # turns passing tests into errors. The display above is a real X server.
      #
      # The screen depth is set explicitly because xvfb-run defaults to 8-bit, where JavaFX cannot
      # render. That alone was not the problem though - see scripts/e2e-baseline.txt for what the
      # numbers actually showed.
      #
      # --fail-never so one failing module cannot skip the ones after it; the ratchet below is what
      # decides whether this job passes, and it checks how many tests ran, not just how many failed.
      - name: Run e2e-tagged tests
        run: |
          mvn -B --fail-never test \
            -Dsurefire.excludedGroups= -Dgroups=e2e --no-transfer-progress
        env:
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Report and enforce the ratchet
        run: bash scripts/e2e-report.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-surefire-reports
          path: '*/target/surefire-reports/*'
          retention-days: 14
          if-no-files-found: warn
